name: Bridge regression tests

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate production GLB reader numerics
        run: python tests/glb_reader_validation.py --require-single-parse --iterations 40

      - name: Validate animation cache and buffer ownership
        run: python tests/animation_cache_validation.py
