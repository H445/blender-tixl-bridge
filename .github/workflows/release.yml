name: Publish add-on release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  unit-tests:
    uses: ./.github/workflows/unit-tests.yml
    permissions:
      contents: read

  release:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release version
        id: metadata
        shell: bash
        run: |
          version="$(python build_addon_zip.py --version)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match add-on version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build versioned add-on ZIP
        run: python build_addon_zip.py

      - name: Create GitHub Release and upload add-on
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "blender-tixl-bridge-${VERSION}.zip"
          --verify-tag
          --generate-notes
          --title "Blender–TiXL Bridge ${VERSION}"
